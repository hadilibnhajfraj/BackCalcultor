name: Deploy React App

on:
  push:
    branches:
      - main  # Branche à surveiller pour les changements

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v2

    - name: Setup Node.js
      uses: actions/setup-node@v2
      with:
        node-version: '16'  # Utilise la version de Node.js adaptée à ton projet

    - name: Install dependencies
      run: |
        cd frontend  # Navigue vers le dossier du projet React
        npm install

    - name: Build React App
      run: |
        cd frontend
        npm run build

    - name: Upload Build as Artifact
      uses: actions/upload-artifact@v2
      with:
        name: build
        path: frontend/build  # Dossier contenant le build React
